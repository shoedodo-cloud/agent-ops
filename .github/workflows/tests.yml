name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]   # ubuntu-latest (26.04) has no Python 3.9 build
        python-version: ['3.9', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4, pinned by commit
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5, pinned by commit
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pytest
        run: pip install pytest==8.4.2
      - name: Run tests
        run: python -m pytest -q
